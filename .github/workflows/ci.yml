name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: backend/package.json }
      - run: npm install
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - run: npm test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: frontend/package.json }
      - run: npm install
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ml, biomech]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip', cache-dependency-path: ${{ matrix.service }}/requirements.txt }
      - run: pip install -r requirements.txt
        working-directory: ${{ matrix.service }}
      - run: pytest
        working-directory: ${{ matrix.service }}

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend, python]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build

  image-scan:
    runs-on: ubuntu-latest
    needs: [docker]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Build production images
        run: |
          docker build --target production -t sprintai-backend:scan ./backend
          docker build --target production -t sprintai-frontend:scan ./frontend
      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: sprintai-backend:scan
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: sprintai-frontend:scan
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
