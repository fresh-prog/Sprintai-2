# When Caddy (TLS) sits in front of us it already sets X-Forwarded-Proto;
# pass it through so the backend knows the client used HTTPS. Direct
# requests fall back to our own scheme.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Content-Security-Policy. Kept compatible with the app's runtime needs:
    # MediaPipe/TF.js compile WASM ('wasm-unsafe-eval') and may spawn blob
    # workers; Google Fonts + Unsplash + the same-origin API/WebSocket must
    # load. The hard locks that actually matter for this SPA are object-src
    # 'none', base-uri 'self', and frame-ancestors 'none'.
    set $csp "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https: wss: ws:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";

    # Long-cache the hashed assets Vite spits out, never-cache the entrypoint.
    location /assets/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
        # A location with its own add_header does NOT inherit server-level
        # headers, so the document's security headers are repeated here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy $csp always;
        try_files $uri =404;
    }

    # SPA fallback — everything else routes through the bundle.
    location / {
        try_files $uri /index.html;
    }

    # Same-origin API: proxy to the backend container so the app works from
    # any device that can reach this host — no rebuild per deployment.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        # Video uploads — must cover UPLOAD_MAX_MB (default 200).
        client_max_body_size 220m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # Socket.IO needs the WebSocket upgrade headers.
    location /socket.io/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }

    # Defensive headers. CSP intentionally permissive for MediaPipe WASM/CDN;
    # tighten once you self-host the model.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;
}
